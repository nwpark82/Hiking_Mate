# Supabase DB 주간 백업
# - 매주 월요일 03:00 (KST) 자동 실행, Actions 탭에서 수동 실행 가능
# - 저장소가 공개(public)이므로 백업 파일은 반드시 암호화한 뒤 업로드
# - 필요한 Repository secrets: SUPABASE_DB_URL, BACKUP_PASSPHRASE (선택: DISCORD_WEBHOOK_URL)
# - 복원 방법: docs/ADMIN_OPERATIONS.md 참고

name: DB Backup

on:
  schedule:
    - cron: '0 18 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check secrets
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::SUPABASE_DB_URL / BACKUP_PASSPHRASE secret이 설정되지 않았습니다."
            exit 1
          fi

      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Dump and encrypt
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          FILE="hikingmate-$(date -u +%Y%m%d).dump"
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" \
            --format=custom --no-owner --no-privileges \
            --schema=public --schema=private --schema=auth \
            --file="$FILE"
          gpg --batch --yes --pinentry-mode loopback --symmetric --cipher-algo AES256 \
            --passphrase "$BACKUP_PASSPHRASE" --output "$FILE.gpg" "$FILE"
          rm -f "$FILE"
          ls -lh "$FILE.gpg"
          echo "BACKUP_FILE=$FILE.gpg" >> "$GITHUB_ENV"

      - name: Upload encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_FILE }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 90

      - name: Notify failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            curl -s -X POST -H "Content-Type: application/json" \
              -d '{"content":"⚠️ **DB 주간 백업 실패** — GitHub Actions 로그를 확인하세요.","allowed_mentions":{"parse":[]}}' \
              "$DISCORD_WEBHOOK_URL"
          fi
